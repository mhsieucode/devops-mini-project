services:
  mongo:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "3000:80"
